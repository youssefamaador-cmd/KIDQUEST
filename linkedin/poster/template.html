<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Arabic:wght@500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#000}
body{font-family:Geist,Inter,system-ui,sans-serif;color:#f5f5f7;overflow:hidden}
.bg{position:absolute;inset:0;background:
 radial-gradient(620px 520px at 12% 8%,rgba(41,151,255,.32),transparent 70%),
 radial-gradient(640px 560px at 92% 22%,rgba(191,90,242,.26),transparent 70%),
 radial-gradient(720px 600px at 30% 102%,rgba(48,209,88,.20),transparent 70%),
 radial-gradient(600px 500px at 100% 100%,rgba(var(--accent-rgb),.22),transparent 70%),
 #050507}
.card{position:absolute;inset:44px;border-radius:44px;border:1px solid rgba(255,255,255,.12);
 background:linear-gradient(180deg,rgba(28,28,30,.55),rgba(12,12,14,.55));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08);padding:64px 68px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:20px}
.logo{width:76px;height:76px;border-radius:20px;background:linear-gradient(180deg,#2c2c2e,#1c1c1e);
 border:1px solid rgba(255,255,255,.14);display:grid;place-items:center}
.brand{font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1}
.brand i{display:block;font-family:"Instrument Serif",serif;font-weight:400;font-size:30px;letter-spacing:0;
 background:linear-gradient(90deg,#9ecbff,#c7b8ff,#8af0d0);-webkit-background-clip:text;color:transparent;margin-top:2px}
.kicker{margin-left:auto;font-size:22px;font-weight:600;padding:12px 22px;border-radius:999px;
 background:rgba(var(--accent-rgb),.16);border:1px solid rgba(var(--accent-rgb),.5);color:rgb(var(--accent-rgb))}
.emoji{font-size:96px;margin-top:auto;line-height:1}
h1{font-weight:800;font-size:var(--h1size,78px);line-height:1.03;letter-spacing:-.025em;margin-top:28px}
h1 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;letter-spacing:0;
 background:linear-gradient(90deg,#9ecbff,#c7b8ff,#8af0d0);-webkit-background-clip:text;color:transparent}
.sub{font-size:30px;color:#a1a1a6;margin-top:22px;line-height:1.3;font-weight:500}
ul{list-style:none;margin-top:48px;display:flex;flex-direction:column;gap:18px}
li{display:flex;gap:18px;align-items:flex-start;font-size:31px;line-height:1.3;font-weight:500}
li b{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-top:1px;
 background:rgba(var(--accent-rgb),.18);color:rgb(var(--accent-rgb));font-size:22px}
.foot{margin-top:auto;padding-top:56px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pill{font-size:24px;font-weight:600;padding:14px 24px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.pill.price{background:#f5f5f7;color:#000;border-color:#f5f5f7}
.url{width:100%;margin-top:26px;font-size:24px;color:#a1a1a6;display:flex;justify-content:space-between}
.url span:last-child{color:#f5f5f7;font-weight:600}
</style></head>
<body>
<div class="bg"></div>
<div class="card">
 <div class="top">
  <div class="logo"><svg width="42" height="42" viewBox="0 0 24 24" fill="none"><path d="M12 2.6 20.2 7.3v9.4L12 21.4 3.8 16.7V7.3Z" stroke="#f5f5f7" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 8.3 15.6 15H8.4Z" fill="#f5f5f7"/></svg></div>
  <div class="brand">AMAADOR<i>Academy</i></div>
  <div class="kicker" id="kicker"></div>
 </div>
 <div class="emoji" id="emoji"></div>
 <h1 id="title"></h1>
 <div class="sub" id="sub"></div>
 <ul id="bullets"></ul>
 <div class="foot" id="pills"></div>
 <div class="url"><span>Free to study · EN · FR · ع</span><span id="url">amaadoracademy.com</span></div>
</div>
<script>
const d = window.POSTER || {};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.documentElement.style.setProperty('--accent-rgb', d.accent || '41,151,255');
if (d.h1size) document.documentElement.style.setProperty('--h1size', d.h1size + 'px');
document.getElementById('kicker').textContent = d.kicker || '';
document.getElementById('emoji').textContent = d.emoji || '';
document.getElementById('title').innerHTML = esc(d.title || '').replace(/\*(.+?)\*/g, '<em>$1</em>');
document.getElementById('sub').textContent = d.sub || '';
document.getElementById('bullets').innerHTML = (d.bullets || []).map(b => '<li><b>✓</b><span>' + esc(b) + '</span></li>').join('');
document.getElementById('pills').innerHTML = (d.pills || []).map((p, i) => '<div class="pill' + (i === 0 ? ' price' : '') + '">' + esc(p) + '</div>').join('');
if (d.url) document.getElementById('url').textContent = d.url;
</script>
</body></html>
